      - paragraph [ref=f3e62]: "Ausnahme für alle Tarife: Die Kursauswahl gilt innerhalb deiner gebuchten Kurse und innerhalb der freien Plätze. Der Beitrag wird monatlich abgebucht, auch bei der 12-Monats-Variante; auf Wunsch ist eine Vorauszahlung von 4 oder 12 Monaten möglich."
